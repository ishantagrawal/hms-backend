[package]
name = "hmsmess_backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.5", features = ["cors"] }
libsql = "0.3"
chrono = "0.4"
# Using rustls to prevent Render 512MB RAM build crashes
web-push = { version = "0.10", default-features = false, features = ["rustls-tls"] }