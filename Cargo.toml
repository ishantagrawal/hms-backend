[package]
name = "hmsmess_backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.5", features = ["cors"] }
libsql = "0.3"

web-push = { version = "0.11", default-features = false, features = ["isahc-rustls"] }
